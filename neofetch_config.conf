####################################
## ********** Colors ************ ##
####################################
reset="\033[0m"

# foreground colors
fg_red="\033[1;31m"
fg_green="\033[1;32m"
fg_yellow="\033[1;33m"
fg_blue="\033[1;34m"
fg_magenta="\033[1;35m"
fg_cyan="\033[1;36m"

# background colors
bg_black="033[40m"
bg_red="\033[41m"
bg_green="\033[42m"
bg_yellow="\033[43m"
bg_blue="\033[44m"
bg_magenta="\033[5;45m"
bg_cyan="\033[46m"
bg_white_grey="\033[5;47m"

fg_rand_color() {
    colors=("$fg_red" "$fg_green" "$fg_yellow" "$fg_blue" "$fg_magenta" "$fg_cyan")
    echo ${colors[RANDOM % ${#colors[@]}]}
}

###################
## Informationss ##
###################
print_info() {
    prin "${bg_magenta} * * * * * * * * * * * * * * * * * * * * * * * * * * * * * * * * * * * ${reset}"
    prin "${bg_magenta} *${reset}"
    info "${bg_magenta} *${reset}\n \n $(fg_rand_color)OS ${reset}" distro
    info "${bg_magenta} *${reset}\n \n $(fg_rand_color)Kernel ${reset}" kernel
    info "${bg_magenta} *${reset}\n \n $(fg_rand_color)DE ${reset}" de
    info "${bg_magenta} *${reset}\n \n $(fg_rand_color)Host ${reset}" model
    info "${bg_magenta} *${reset}\n \n $(fg_rand_color)CPU ${reset}" cpu
    info "${bg_magenta} *${reset}\n \n $(fg_rand_color)Shell ${reset}" shell
    info "${bg_magenta} *${reset}\n \n $(fg_rand_color)Resolution${reset}" resolution
    info "${bg_magenta} *${reset}\n \n $(fg_rand_color)Packages ${reset}" packages
    info "${bg_magenta} *${reset}\n \n $(fg_rand_color)Uptime ${reset}" uptime
    info "${bg_magenta} *${reset}\n \n $(fg_rand_color)Theme ${reset}" theme
    info "${bg_magenta} *${reset}\n \n $(fg_rand_color)Icons ${reset}" icons
    info "${bg_magenta} *${reset}\n \n $(fg_rand_color)Terminal ${reset}" term
    info "${bg_magenta} *${reset}\n \n $(fg_rand_color)GPU${reset}" gpu
#    info "${bg_magenta} *${reset}\n \n $(fg_rand_color)GPU Driver${reset}" gpu_driver
    info "${bg_magenta} *${reset}\n \n $(fg_rand_color)Memory ${reset}" memory
#    info "${bg_magenta} *${reset}\n \n $(fg_rand_color)Disk ${reset}" disk
#    info "${bg_magenta} *${reset}\n \n $(fg_rand_color)Battery ${reset}" battery
    prin "${bg_magenta} *${reset}"
    prin "${bg_magenta} * * * * * * * * * * * * * * * * * * * * * * * * * * * * * * * * * * * ${reset}"

    info cols
}

###########
## Title ##
###########
title_fqdn="off"

############
## Kernel ##
############
kernel_shorthand="on"

############
## Distro ##
############
distro_shorthand="off"
os_arch="on"
############
## Uptime ##
############
uptime_shorthand="on"

############
## Memory ##
############
memory_percent="off"
memory_unit="mib"

##############
## Packages ##
##############
package_managers="on"

###########
## Shell ##
###########
shell_path="off"
shell_version="on"

#########
## CPU ##
#########
speed_type="bios_limit"
speed_shorthand="off"
cpu_brand="on"
cpu_speed="on"
cpu_cores="logical"
cpu_temp="off"

#########
## GPU ##
#########
gpu_brand="on"
gpu_type="all"

################
## Resolution ##
################
refresh_rate="off"

##############################
## Gtk Theme / Icons / Font ##
##############################
gtk_shorthand="off"
gtk2="on"
gtk3="on"

################
## IP Address ##
################
public_ip_host="http://ident.me"
public_ip_timeout=2
local_ip_interface=('auto')

#########################
## Desktop Environment ##
#########################
de_version="on"

##########
## Disk ##
##########
disk_show=('/')
disk_subtitle="mount"
disk_percent="on"

##########
## Song ##
##########
music_player="auto"
song_format="%artist% - %album% - %title%"
song_shorthand="off"
mpc_args=()

#################
## Text Colors ##
#################
colors=(distro)

##################
## Text Options ##
##################
bold="on"
underline_enabled="on"
underline_char="-"
separator=" :"

##################
## Color Blocks ##
##################
block_range=(0 15)
color_blocks="on"
block_width=5
block_height=1
col_offset="auto"

###################
## Progress Bars ##
###################
bar_char_elapsed="-"
bar_char_total="="
bar_border="on"
bar_length=15
bar_color_elapsed="distro"
bar_color_total="distro"
memory_display="off"
battery_display="of"
disk_display="off"

######################
## Backend Settings ##
######################
image_backend="ascii"
image_source="auto"

###################
## Ascii Options ##
###################
ascii_distro="auto"
ascii_colors=(distro)
ascii_bold="on"

###################
## Image Options ##
###################
image_loo="off"
thumbnail_dir="${XDG_CACHE_HOME:-${HOME}/.cache}/thumbnails/neofetch"
crop_mode="normal"
crop_offset="center"
image_size="auto"
catimg_size="2"
gap=3
yoffset=0
xoffset=0
background_color=

##################
## Misc Options ##
##################
stdout="off"
